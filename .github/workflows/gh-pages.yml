name: Publish Zensical site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Generate page graph
        run: uv run python scripts/build_graph.py
      - name: Prepare Zensical content
        run: uv run python scripts/prepare_zensical_content.py
      - name: Build site with Zensical
        run: uv run zensical build --config-file zensical.toml --clean
      - name: Validate generated site
        run: uv run python scripts/validate_site.py generated
      - name: Publish to GitHub Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: generated
          publish_branch: gh-pages
          cname: wiki.adhadse.com
