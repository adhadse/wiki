[project.theme]
variant = "classic"
custom_dir = "overrides"
logo = "assets/adhadse.png"
favicon = "assets/logo-wiki.png"
features = [
  "navigation.instant",
  "navigation.tracking",
  "navigation.indexes",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.top",
  "toc.follow",
  "search.suggest",
  "search.highlight",
  "content.tabs.link",
  "content.code.annotate",
  "content.code.copy",
  "navigation.footer",
]

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[project.theme.icon.admonition]
info = "material/alert-circle"
success = "material/check-circle"
warning = "material/alert"
danger = "material/alert-octagon"
quote = "material/alert-circle"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "black"
accent = "blue"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "blue"
toggle.icon = "material/weather-night"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
footnotes = {}
md_in_html = {}
tables = {}
pymdownx.arithmatex.generic = true
pymdownx.details = {}
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.inlinehilite = {}
pymdownx.mark = {}
pymdownx.snippets = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.highlight.linenums_style = "pymdownx-inline"

[project.plugins.glightbox]
[project.plugins.search]
[project.plugins.social]
cards_layout = "default/only/image"
cards_layout_options.background_image = "layouts/social_bg.png"
cards_layout_options.font_family = "Inter"

[project.extra.analytics]
provider = "google"
property = "G-PEQP6Y2BMV"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/adhadse/"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/in/adhadse/"

[project.validation]
absolute_links = "ignore"

[project.validation.nav]
omitted_files = "ignore"
